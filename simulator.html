                    "question": "5. 컴퓨터 시스템은 내부/외부에서 발생하는 각종 event 에 대처하기 위해, 다양한 방식으로\n인터럽트(interrupt)체계를 구현하고 있다. 이와 관련하여 아래 사항을 설명하시오.\n가. Polling 방식\n나. Daisy-Chain 방식\n다. Vector Interrupt 방식"
          },
          {
                    "id": 152,
                    "session": "2교시",
                    "domain": "CA/OS",
                    "qNum": 6,
                    "question": "6. 인공지능 시대의 H/W 기술에 대하여 다음을 설명하시오.\n가. 메모리 월\n나. HBM와 HBF 비교\n다. CXL 3.0"
          }
];

        // 앱 상태 변수
        let currentSession = null;
        let currentDomainFilter = 'ALL';
        let currentQuestionIndex = 0;
        let activeQuestions = []; // 현재 선택된 교시(+도메인)의 문제 목록

        // 로컬 스토리지에서 답안 불러오기 (없으면 빈 객체)
        function getStoredAnswers() {
            try {
                return JSON.parse(localStorage.getItem('tech_exam_answers')) || {};
            } catch (e) {
                return {};
            }
        }

        // 답안 저장하기
        function saveAnswer(id, text) {
            const answers = getStoredAnswers();
            answers[id] = text;
            localStorage.setItem('tech_exam_answers', JSON.stringify(answers));
            showSaveIndicator();
        }

        // 저장 완료 뱃지 깜빡임 효과
        function showSaveIndicator() {
            const indicator = document.getElementById('auto-save-status');
            indicator.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';
            setTimeout(() => {
                indicator.innerHTML = '<i class="fa-solid fa-check"></i> 저장됨';
            }, 300);
        }

        // 뷰 전환 함수
        function switchView(viewName) {
            document.getElementById('view-mode-select').classList.add('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-solve').classList.add('hidden');

            if (viewName === 'mode-select') {
                document.getElementById('view-mode-select').classList.remove('hidden');
            } else if (viewName === 'dashboard') {
                document.getElementById('view-dashboard').classList.remove('hidden');
                renderDashboard();
            } else if (viewName === 'solve') {
                document.getElementById('view-solve').classList.remove('hidden');
                renderSolveView();
            }
        }

        function updateActiveQuestions() {
            activeQuestions = mockData.filter(q => {
                if (q.session !== currentSession) return false;
                if (currentDomainFilter !== 'ALL' && q.domain !== currentDomainFilter) return false;
                return true;
            });
        }

        // 교시 선택
        function selectSession(session) {
            currentSession = session;
            currentDomainFilter = 'ALL';
            updateActiveQuestions();
            switchView('dashboard');
        }

        function selectDomainFilter(domain) {
            currentDomainFilter = domain;
            updateActiveQuestions();
            renderDashboard();
        }

        function goBackToHome() {
            currentSession = null;
            switchView('mode-select');
        }

        function goBackToDashboard() {
            switchView('dashboard');
        }

        // 대시보드 렌더링
        function renderDashboard() {
            document.getElementById('dashboard-title').innerText = `${currentSession} 모의고사 문제 목록`;
            const container = document.getElementById('question-list-container');
            const filterBar = document.getElementById('domain-filter-bar');
            const answers = getStoredAnswers();

            // 도메인 필터 버튼 렌더링
            const sessionItems = mockData.filter(q => q.session === currentSession);
            const domains = ['ALL', ...new Set(sessionItems.map(q => q.domain))];
            filterBar.innerHTML = domains.map(d => {
                const count = d === 'ALL' ? sessionItems.length : sessionItems.filter(q => q.domain === d).length;
                const activeClass = currentDomainFilter === d
                    ? 'bg-indigo-600 text-white border-indigo-500'
                    : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-indigo-400';
                const label = d === 'ALL' ? `전체 (${count})` : `${d} (${count})`;
                return `<button onclick="selectDomainFilter('${d}')" class="text-xs px-3 py-1.5 rounded-full border font-medium transition cursor-pointer ${activeClass}">${label}</button>`;
            }).join('');

            let completedCount = 0;
            let html = '';

            activeQuestions.forEach((q, idx) => {
                const isAnswered = answers[q.id] && answers[q.id].trim().length > 0;
                if (isAnswered) completedCount++;

                html += `
                    <div onclick="openSolveView(${idx})" class="bg-slate-800 hover:bg-slate-750 border border-slate-700/80 hover:border-indigo-500 rounded-xl p-4 transition cursor-pointer flex items-center justify-between group">
                        <div class="flex items-center gap-3 overflow-hidden pr-2">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-700 text-sky-300 shrink-0">${q.domain}</span>
                            <span class="text-sm font-bold text-slate-400 w-12 shrink-0">Q.${idx + 1}</span>
                            <p class="text-sm text-slate-200 truncate font-medium">${q.question.split('\n')[0]}</p>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            ${isAnswered 
                                ? '<span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-medium"><i class="fa-solid fa-check"></i> 작성 완료</span>' 
                                : '<span class="text-xs bg-slate-700 text-slate-400 px-3 py-1 rounded-full font-medium">미작성 ⚪</span>'}
                            <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition"></i>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('completion-badge').innerText = `작성 완료: ${completedCount} / ${activeQuestions.length}`;
        }

        // 개별 문제 열기
        function openSolveView(index) {
            currentQuestionIndex = index;
            switchView('solve');
        }

        // 작성 화면 렌더링
        function renderSolveView() {
            const q = activeQuestions[currentQuestionIndex];
            const answers = getStoredAnswers();

            document.getElementById('solve-session-badge').innerText = q.session;
            document.getElementById('solve-domain-badge').innerText = q.domain;
            document.getElementById('solve-qnum').innerText = `문제 ${currentQuestionIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('solve-question-text').innerText = q.question;
            document.getElementById('answer-textarea').value = answers[q.id] || '';
            document.getElementById('solve-nav-info').innerText = `[${q.domain}] ${currentQuestionIndex + 1}번 문제`;
        }

        // 타이핑 시 실시간 저장
        function handleAnswerInput(value) {
            const q = activeQuestions[currentQuestionIndex];
            saveAnswer(q.id, value);
        }

        // 이전/다음 문제 이동
        function moveQuestion(direction) {
            const newIndex = currentQuestionIndex + direction;
            if (newIndex >= 0 && newIndex < activeQuestions.length) {
                currentQuestionIndex = newIndex;
                renderSolveView();
            }
        }

        // 📋 내가 푼 답안 전체 복사 기능
        function copyAllAnswers() {
            const answers = getStoredAnswers();
            let exportText = "======================================\n";
            exportText += "[정보관리기술사 실전 모의고사 백지 인출 답안]\n\n";

            let count = 0;
            mockData.forEach((q) => {
                const userAns = answers[q.id];
                if (userAns && userAns.trim().length > 0) {
                    count++;
                    exportText += `${count}. [${q.session} / ${q.domain}] 문제: ${q.question.replace(/\n/g, ' ')}\n`;
                    exportText += `- 작성 내용:\n${userAns}\n\n--------------------------------------\n\n`;
                }
            });

            if (count === 0) {
                showToast("작성된 답안이 없습니다. 먼저 문제를 풀고 시도해주세요!", "bg-amber-600");
                return;
            }

            exportText += "======================================\n";

            // 클립보드 복사
            navigator.clipboard.writeText(exportText).then(() => {
                showToast(`총 ${count}개의 작성 답안이 클립보드에 복사되었습니다!`);
            }).catch(() => {
                showToast("복사에 실패했습니다. 권한을 확인해주세요.", "bg-rose-600");
            });
        }

        // 토스트 알림 띄우기
        function showToast(msg, bgClass = "bg-emerald-600") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toast.className = `fixed bottom-6 right-6 ${bgClass} text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 font-medium flex items-center gap-2 z-50`;
            toastMsg.innerText = msg;

            setTimeout(() => {
                toast.className = "fixed bottom-6 right-6 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 translate-y-20 opacity-0 pointer-events-none font-medium flex items-center gap-2 z-50";
            }, 3000);
        }
    </script>
</body>
</html>
