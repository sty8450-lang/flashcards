<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보관리기술사 실전 모의고사 머신 및 암기장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 상단 헤더 -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-indigo-400"></i> 정보관리기술사 모의고사 머신
                </h1>
                <p class="text-sm text-slate-400 mt-1">실전 모의고사 백지 인출 및 자율 선택 시뮬레이터</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchMode('flashcard')" id="nav-btn-flashcard" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-clone"></i> 모의고사 카드 보기
                </button>
                <button onclick="switchMode('mock')" id="nav-btn-mock" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib"></i> 실전 모의고사 머신
                </button>
            </div>
        </header>

        <!-- 메인 컨테이너 -->
        <main id="app">
            <!-- [모드 1] 모의고사 카드 학습 뷰 -->
            <div id="view-flashcard" class="hidden space-y-6">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-xl relative min-h-[360px] flex flex-col justify-between">
                    <div class="flex justify-between items-center mb-4">
                        <span id="card-domain-badge" class="text-xs px-3 py-1 rounded-full font-semibold bg-indigo-950 text-indigo-300 border border-indigo-800">모의고사</span>
                        <span id="card-counter" class="text-sm text-slate-400 font-mono">1 / 1</span>
                    </div>

                    <div class="text-center my-auto space-y-4">
                        <h2 id="card-topic" class="text-xl font-bold text-white">모의고사 문항</h2>
                        <div id="card-content" class="text-slate-300 text-sm whitespace-pre-line leading-relaxed max-w-lg mx-auto bg-slate-900/60 p-4 rounded-xl border border-slate-750 font-medium">
                            문제 지문 내용이 여기에 표시됩니다.
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-6 border-t border-slate-700 mt-6">
                        <button onclick="prevCard()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm transition cursor-pointer">
                            <i class="fa-solid fa-arrow-left"></i> 이전 문제
                        </button>
                        <span class="text-xs text-slate-400">노션 모의고사 전 문항 연동</span>
                        <button onclick="nextCard()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm transition cursor-pointer">
                            다음 문제 <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- [모드 2] 실전 모의고사 머신 뷰 -->
            <div id="view-mock" class="space-y-6">
                <!-- 교시 선택 및 개수 설정 화면 -->
                <div id="mock-config" class="bg-slate-800/50 border border-slate-700 rounded-2xl p-6 text-center space-y-6 max-w-lg mx-auto">
                    <h2 class="text-xl font-bold text-white">실전 모의고사 백지 인출 세팅</h2>
                    <p class="text-sm text-slate-400">연습할 교시와 풀고 싶은 문제 수를 선택하세요.</p>
                    
                    <div class="flex justify-center gap-3">
                        <button onclick="selectMockSession('1교시')" id="session-btn-1" class="session-btn px-5 py-3 bg-indigo-950 border border-indigo-500 rounded-xl font-semibold text-indigo-200 cursor-pointer transition">1교시형 (단답형)</button>
                        <button onclick="selectMockSession('2교시')" id="session-btn-2" class="session-btn px-5 py-3 bg-slate-900 border border-slate-700 rounded-xl font-semibold text-slate-400 cursor-pointer transition">2교시형 (서술형)</button>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setMockCount(4)" class="count-btn p-2 bg-slate-900 border border-indigo-500 rounded-lg text-xs font-medium cursor-pointer text-indigo-300">⚡ 미니 (4제)</button>
                        <button onclick="setMockCount(10)" class="count-btn p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-medium cursor-pointer">🎯 표준 (10제)</button>
                        <button onclick="setMockCount('all')" class="count-btn p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-medium cursor-pointer">📚 전체 보기</button>
                    </div>

                    <button onclick="startMockSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition shadow-lg cursor-pointer">
                        🎲 모의고사 세트 시작하기
                    </button>
                </div>

                <!-- 모의고사 문제 풀이 화면 -->
                <div id="mock-solve-area" class="hidden space-y-4">
                    <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                        <button onclick="backToMockConfig()" class="text-sm text-indigo-400 hover:text-indigo-300 transition flex items-center gap-2 cursor-pointer font-medium">
                            <i class="fa-solid fa-arrow-left"></i> 세팅 화면으로
                        </button>
                        <div id="mock-progress-info" class="text-xs text-slate-400">문제 1 / 4</div>
                        <button onclick="copyMockAnswers()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer flex items-center gap-1.5">
                            <i class="fa-solid fa-copy"></i> 📋 푼 답안 전체 복사
                        </button>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md">
                        <div class="flex items-center gap-2 mb-3">
                            <span id="mock-solve-badge" class="text-xs px-2.5 py-1 rounded font-semibold bg-indigo-900 text-indigo-200">1교시</span>
                            <span id="mock-solve-title" class="text-sm font-bold text-slate-300">모의고사 문항</span>
                        </div>
                        <div id="mock-solve-question" class="text-base text-slate-100 whitespace-pre-line leading-relaxed font-medium">
                            문제 지문 내용
                        </div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md space-y-2">
                        <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                            <span>✍️ 백지 인출 답안 작성 (실시간 자동 저장됨)</span>
                            <span id="mock-save-status" class="text-emerald-400 font-medium"><i class="fa-solid fa-check"></i> 저장됨</span>
                        </div>
                        <textarea id="mock-textarea" rows="12" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-slate-100 focus:outline-none focus:border-indigo-500 font-mono text-sm leading-relaxed"
                            placeholder="키워드 및 답안을 거침없이 타이핑하세요..."
                            oninput="saveMockAnswer(this.value)"></textarea>
                    </div>

                    <div class="flex justify-between pt-2">
                        <button onclick="moveMockQuestion(-1)" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm text-slate-300 transition cursor-pointer">
                            <i class="fa-solid fa-chevron-left"></i> 이전 문제
                        </button>
                        <button onclick="moveMockQuestion(1)" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm text-slate-300 transition cursor-pointer">
                            다음 문제 <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 translate-y-20 opacity-0 pointer-events-none font-medium flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-lg"></i> <span id="toast-msg">복사되었습니다!</span>
    </div>

            { id: 53, session: "2교시", question: "2. AI 자동화가 단순 반복 업무를 넘어 전문직·관리직의 핵심 업무까지 확산되면서, 기업의 조직 운영 방식과 인재 요구 조건이 급격히 변화하고 있다. 특히 엔트리급 일자리 감소와 AI 네이티브 직무의 증가가 동시에 나타나며, AI 시대의 핵심 과제는 단순한 일자리 증감이 아닌 역량 전환으로 이동하고 있다. 다음 사항에 대하여 설명하시오.\n가. AI 기술발전에 따른 노동시장의 변화\n나. AI 시대 인재의 기본 역량\n다. AI 시대 인재육성 전략" },
            { id: 54, session: "2교시", question: "3. 인공지능 기술이 활성화되면서 데이터센터의 전력수급 문제가 부각되고 있다. 다음을 설명하시오.\n가. 마이크로 그리드(Micro-Grid)\n나. AMI(Advance Metering Infrastructure)\n다. 인터미턴트 컴퓨팅(Intermittent computing)" },
            { id: 55, session: "2교시", question: "4. NIA(한국지능정보사회진흥원)의 클라우드 네이티브 구축 및 운영 가이드(2026. 01)에 대하여 다음을 설명하시오.\n가. 클라우드 네이티브 개념 및 구성요소\n나. 클라우드 네이티브 사업 유형\n다. 클라우드 네이티브 성숙도 모델" },
            { id: 56, session: "2교시", question: "5. 중앙은행 디지털화폐(CBDC, Central Bank Digital Currency)가 블록체인 기반 금융 인프라의 핵심으로 논의되고 있다. 다음에 대하여 설명하시오.\n가. CBDC의 개념\n나. CBDC 구현 시 아키텍처 설계 방안\n다. CBDC 도입이 기존 금융 시스템 및 스테이블코인과의 관계에 미치는 영향" },
            { id: 57, session: "2교시", question: "6. 제조업의 스마트팩토리 전환이 가속화되며, 가상 공간에서 생산 공정을 사전 시뮬레이션하는 디지털 트윈(Digital Twin) 기술이 핵심 동인으로 주목받고 있다. 다음을 설명하시오.\n가. 스마트팩토리(Smart Factory)에서 디지털 트윈(Digital Twin)의 역할과 구성요소\n나. 디지털 트윈 도입을 위한 고려사항" },

            { id: 71, session: "2교시", question: "1. A기업은 AI 전환(AX, AI Transformation) 추진을 위해 LLM(Large Language Model) 기반 AI 시스템을 구축하고자 한다. 다음을 설명하시오.\n가. 파인튜닝(Fine-Tuning)과 RAG(Retrieval-Augmented Generation)의 개념 및 역할\n나. LLM 정렬을 위한 RLHF(Reinforcement Learning from Human Feedback) 기반 학습 파이프라인과 RAFT(Retrieval Augmented Fine-Tuning) 기반 학습 파이프라인 비교" },
            { id: 72, session: "2교시", question: "2. MLOps가 LLM 서비스 운영을 위한 LLMOps로 진화하고 있다. 다음을 설명하시오.\n가. MLOps 와 LLMOps 의 개념 및 비교\n나. LLMOps 파이프라인 구성 요소\n다. 공공부문 LLM 서비스 도입 시 고려사항" },
            { id: 73, session: "2교시", question: "3. 기업의 LLM 도입이 확산되면서 OWASP가 제시한 LLM 보안 위협에 대한 체계적 대응이 요구되고 있다. 다음을 설명하시오.\n가. OWASP LLM Top 10의 주요 위협 유형\n나. LLM 서비스 계층별(데이터·모델·애플리케이션) 위협 발생 원인\n다. LLM 보안 대응 체계 구축 방안" },
            { id: 74, session: "2교시", question: "4. 폰노이만 아키텍처의 한계 극복방안과 뉴로모픽 컴퓨팅의 구조적 특징을 설명하시오." },
            { id: 75, session: "2교시", question: "5. 생성형 AI 모델의 성능과 신뢰성을 높이기 위해서는 고품질 데이터 구축이 필수이다. 이에 생성형 AI 데이터 품질관리 가이드라인 v2.0 이 2025년 2월 발간되었다. 다음에 대하여 설명하시오.\n가. 생성형 AI 의 정의 및 생성형 AI 데이터의 특성\n나. 생성형 AI 품질관리 프레임워크 프로세스\n다. 생성형 AI 데이터 품질지표" },
            { id: 76, session: "2교시", question: "6. 검색 증강 생성(RAG, Retrieval-Augmented Generation)은 LLM의 환각과 최신성 한계를 보완하는 방식으로 도입되었으나, 적용 범위가 넓어지면서 단순 검색 결합에서 모듈화, 자율 제어로 발전해 왔다. 다음을 설명하시오.\n가. RAG의 기본 개념과 동작 메커니즘\n나. Advanced RAG와 Modular RAG의 특징 및 비교\n다. 기존 RAG의 구조적 한계와 에이전트형 RAG(Agentic RAG) 적용 방안" },

            { id: 131, session: "2교시", question: "4. 전송계층의 제공 기능인 흐름제어에 대하여 다음을 설명하시오.\n가. TCP 흐름제어 개념\n나. 슬라이딩 윈도우\n다. Silly Window Syndrome" },
            { id: 132, session: "2교시", question: "5. AI-RAN의 개념, 기술요소를 설명하고, RAN과의 차이점을 설명하시오." },
            { id: 133, session: "2교시", question: "6. 최근 생성형 AI 서비스 확산으로 대용량 학습 트래픽과 실시간 추론 트래픽이 동일 망을 공유하게 되면서, 트래픽 특성에 맞는 품질 보장이 중요해지고 있다. 네트워크 QoS(Quality of Service)에 대하여 다음을 설명하시오.\n가. QoS의 개념과 주요 품질 지표\n나. QoS 제공 모델인 IntServ와 DiffServ의 비교\n다. AI 트래픽 환경에서의 QoS 요구사항과 적용 방안" },

            // ==========================================
            // [Set 8] 컴퓨터구조 및 운영체제(CAOS) 모의고사 (1교시 13문항, 2교시 6문항)
            // ==========================================
            { id: 134, session: "1교시", question: "1. 교착상태(Deadlock)의 조건과 해결방안" },
            { id: 135, session: "1교시", question: "2. 프로세스 스레싱(Thrashing)에 대하여 설명하시오." },
            { id: 136, session: "1교시", question: "3. GPU(Graphics Processing Unit)와 TPU(Tensor Processing Unit) 비교" },
            { id: 137, session: "1교시", question: "4. 인터럽트(Interrupt)에 대하여 설명하시오." },
            { id: 138, session: "1교시", question: "5. UPS(Uninterruptible Power Supply)의 주요기능과 구성요소" },

            { id: 142, session: "1교시", question: "9. 선점형 스케줄링(Preemptive Scheduling)" },
            { id: 143, session: "1교시", question: "10. 시스템 장애를 해결하기 위한 고가용성과 내고장성 기술 비교" },
            { id: 144, session: "1교시", question: "11. 뉴로모픽 컴퓨팅" },
            { id: 145, session: "1교시", question: "12. 운영체제 동기화 기법에 대하여 설명하시오." },
            { id: 146, session: "1교시", question: "13. 메모리 단편화와 해결방안" },

            { id: 147, session: "2교시", question: "1. 프로그램 실행 시 운영체제는 메모리를 4가지 주요 영역으로 나누어 할당 및 관리한다. 각 영역의 역할과 특징 그리고 영역 간 동작 메커니즘에 대하여 다음 내용을 설명하시오.\n가. 코드(Code)\n나. 데이터(Data)\n다. 힙(Heap)\n라. 스택(Stack)" },
            { id: 148, session: "2교시", question: "2. 캐시메모리에 대하여 다음을 설명하시오.\n가. 캐시메모리의 개념\n나. 캐시메모리 교체 기법과 사상 기법 3가지\n다. 지역성과 캐시메모리 관리에서 지역성이 중요한 이유" },
            { id: 149, session: "2교시", question: "3. 운영체제의 문맥교환(Context Switching)에 대하여 다음 질문에 답하시오.\n가. 문맥의 개념과 유형\n나. 문맥교환의 개념과 프로세스 상태전이도에서의 문맥교환 발생시점\n다. 문맥교환의 절차" },
            { id: 150, session: "2교시", question: "4. 병렬 컴퓨팅에 대하여 다음을 설명하시오.\n가. 병렬 컴퓨팅 개념\n나. 병렬 프로세스(컴퓨팅) 분류" },
            { id: 151, session: "2교시", question: "5. 컴퓨터 시스템은 내부/외부에서 발생하는 각종 event에 대처하기 위해, 다양한 방식으로 인터럽트(interrupt) 체계를 구현하고 있다. 이와 관련하여 아래 사항을 설명하시오.\n가. Polling 방식\n나. Daisy-Chain 방식\n다. Vector Interrupt 방식" },
            { id: 152, session: "2교시", question: "6. 인공지능 시대의 H/W 기술에 대하여 다음을 설명하시오.\n가. 메모리 월(Memory Wall)\n나. HBM와 HBF 비교\n다. CXL 3.0" }
        ];

        let currentMode = 'mock'; // 기본 진입을 모의고사 머신으로
        let currentCardIndex = 0;

        let mockSession = '1교시';
        let mockCount = 4;
        let activeMockQuestions = [];
        let currentMockIndex = 0;

        window.onload = function() {
            switchMode('mock');
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('view-flashcard').classList.add('hidden');
            document.getElementById('view-mock').classList.add('hidden');
            
            document.getElementById('nav-btn-flashcard').className = "bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer flex items-center gap-2";
            document.getElementById('nav-btn-mock').className = "bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer flex items-center gap-2";

            if (mode === 'flashcard') {
                document.getElementById('view-flashcard').classList.remove('hidden');
                document.getElementById('nav-btn-flashcard').className = "bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg cursor-pointer flex items-center gap-2";
                updateCardView();
            } else {
                document.getElementById('view-mock').classList.remove('hidden');
                document.getElementById('nav-btn-mock').className = "bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg cursor-pointer flex items-center gap-2";
            }
        }

        function updateCardView() {
            if (mockData.length === 0) return;
            const item = mockData[currentCardIndex];
            document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${mockData.length}`;
            document.getElementById('card-topic').innerText = `[${item.session}] 모의고사 문항 ${currentCardIndex + 1}`;
            document.getElementById('card-content').innerText = item.question;
        }

        function nextCard() {
            if (currentCardIndex < mockData.length - 1) {
                currentCardIndex++;
                updateCardView();
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCardView();
            }
        }

        function selectMockSession(session) {
            mockSession = session;
            document.querySelectorAll('.session-btn').forEach(b => {
                b.className = "session-btn px-5 py-3 bg-slate-900 border border-slate-700 rounded-xl font-semibold text-slate-400 cursor-pointer transition";
            });
            if (session === '1교시') {
                document.getElementById('session-btn-1').className = "session-btn px-5 py-3 bg-indigo-950 border border-indigo-500 rounded-xl font-semibold text-indigo-200 cursor-pointer transition";
            } else {
                document.getElementById('session-btn-2').className = "session-btn px-5 py-3 bg-indigo-950 border border-indigo-500 rounded-xl font-semibold text-indigo-200 cursor-pointer transition";
            }
        }

        function setMockCount(count) {
            mockCount = count;
            document.querySelectorAll('.count-btn').forEach(b => {
                b.className = "count-btn p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-medium cursor-pointer";
            });
            event.target.className = "count-btn p-2 bg-slate-900 border border-indigo-500 rounded-lg text-xs font-medium cursor-pointer text-indigo-300";
        }

        function startMockSession() {
            const pool = mockData.filter(i => i.session === mockSession);
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            activeMockQuestions = mockCount === 'all' ? shuffled : shuffled.slice(0, Math.min(mockCount, shuffled.length));
            
            if (activeMockQuestions.length === 0) {
                showToast("해당 조건의 문제가 없습니다!", "bg-amber-600");
                return;
            }

            currentMockIndex = 0;
            document.getElementById('mock-config').classList.add('hidden');
            document.getElementById('mock-solve-area').classList.remove('hidden');
            renderMockSolve();
        }

        function backToMockConfig() {
            document.getElementById('mock-solve-area').classList.add('hidden');
            document.getElementById('mock-config').classList.remove('hidden');
        }

        function renderMockSolve() {
            const q = activeMockQuestions[currentMockIndex];
            const stored = getStoredMockAnswers();
            document.getElementById('mock-solve-badge').innerText = q.session;
            document.getElementById('mock-solve-title').innerText = `모의고사 문항 (${currentMockIndex + 1}/${activeMockQuestions.length})`;
            document.getElementById('mock-solve-question').innerText = q.question;
            document.getElementById('mock-progress-info').innerText = `문제 ${currentMockIndex + 1} / ${activeMockQuestions.length}`;
            document.getElementById('mock-textarea').value = stored[q.id] || '';
        }

        function getStoredMockAnswers() {
            try { return JSON.parse(localStorage.getItem('tech_mock_answers')) || {}; } catch(e) { return {}; }
        }

        function saveMockAnswer(val) {
            const q = activeMockQuestions[currentMockIndex];
            const stored = getStoredMockAnswers();
            stored[q.id] = val;
            localStorage.setItem('tech_mock_answers', JSON.stringify(stored));
        }

        function moveMockQuestion(dir) {
            const next = currentMockIndex + dir;
            if (next >= 0 && next < activeMockQuestions.length) {
                currentMockIndex = next;
                renderMockSolve();
            }
        }

        function copyMockAnswers() {
            const stored = getStoredMockAnswers();
            let text = "======================================\n[정보관리기술사 실전 모의고사 백지 인출 답안]\n\n";
            let cnt = 0;
            activeMockQuestions.forEach((q, idx) => {
                const ans = stored[q.id];
                if (ans && ans.trim().length > 0) {
                    cnt++;
                    text += `${cnt}. 문제:\n${q.question}\n\n- 작성 내용:\n${ans}\n\n--------------------------------------\n\n`;
                }
            });
            if (cnt === 0) {
                showToast("작성된 답안이 없습니다!", "bg-amber-600");
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast(`총 ${cnt}개의 작성 답안이 클립보드에 복사되었습니다!`);
            });
        }

        function showToast(msg, bg = "bg-emerald-600") {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.className = `fixed bottom-6 right-6 ${bg} text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 font-medium flex items-center gap-2 z-50`;
            setTimeout(() => {
                t.className = "fixed bottom-6 right-6 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 translate-y-20 opacity-0 pointer-events-none font-medium flex items-center gap-2 z-50";
            }, 3000);
        }
    </script>
</body>
