<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITPE Flashcards</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 600px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        
        /* Home View */
        #home-view { display: flex; flex-direction: column; gap: 16px; flex: 1; }
        .hero-card { background: var(--accent-gradient); border-radius: 16px; padding: 20px; color: #fff; text-align: center; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2); transition: transform 0.1s; }
        .hero-card:active { transform: scale(0.98); }
        .hero-card h2 { font-size: 1.3rem; margin-bottom: 6px; }
        .hero-card p { font-size: 0.85rem; opacity: 0.9; }

        .section-title { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
        
        /* Domain Grid - Optimized for Fold 7 Cover & Inner screens */
        .domain-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 500px) { .domain-grid { grid-template-columns: repeat(3, 1fr); } }
        
        .domain-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 12px; text-align: left; cursor: pointer; color: var(--text-primary); transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 75px; }
        .domain-btn:active { background: var(--border-color); }
        .domain-name { font-weight: 600; font-size: 1rem; }
        .domain-count { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }

        /* Study View */
        #study-view { display: none; flex-direction: column; flex: 1; gap: 14px; }
        .study-header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .progress-text { font-size: 0.85rem; color: var(--text-secondary); }

        /* Flashcard */
        .card-container { perspective: 1000px; flex: 1; display: flex; min-height: 320px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-back { transform: rotateY(180deg); background: #172554; border-color: #1e40af; }
        
        .card-tag { font-size: 0.7rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
        .card-title { font-size: 1.25rem; font-weight: 700; margin: 8px 0; line-height: 1.35; }
        .card-body { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.45; flex: 1; overflow-y: auto; }
        .keywords-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .keyword-badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 16px; font-size: 0.75rem; font-weight: 500; }
        .diagram-box { background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; margin-top: 8px; color: #e2e8f0; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-top: 10px; padding-bottom: 10px; }
        .ctrl-btn { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
        .ctrl-btn:active { background: var(--border-color); }
        .ctrl-btn.primary { background: var(--accent); color: #0f172a; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ITPE Flashcards</h1>
            <span id="total-badge" style="font-size: 0.8rem; color: var(--text-secondary);"></span>
        </header>

        <!-- Home View -->
        <div id="home-view">
            <div class="hero-card" onclick="startStudy('ALL')">
                <h2>전체 셔플 학습</h2>
                <p>모든 도메인 카드를 무작위로 섞어서 풀기</p>
            </div>

            <div>
                <div class="section-title">도메인 선택</div>
                <div class="domain-grid" id="domain-grid">
                    <!-- Dynamic Loading -->
                </div>
            </div>
        </div>

        <!-- Study View -->
        <div id="study-view">
            <div class="study-header">
                <button class="back-btn" onclick="goHome()">← 홈으로</button>
                <div class="progress-text" id="progress-text">1 / 10</div>
            </div>

            <div class="card-container" onclick="flipCard()">
                <div class="card" id="flashcard">
                    <!-- Front -->
                    <div class="card-face card-front">
                        <div>
                            <span class="card-tag" id="front-domain">도메인</span>
                            <div class="card-title" id="front-title">토픽 제목</div>
                        </div>
                        <div class="card-body" style="display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-secondary);">
                            카드를 터치하여 뒷면 확인
                        </div>
                        <div style="text-align: center; font-size: 0.75rem; color: var(--text-secondary);">탭하여 뒤집기 ↻</div>
                    </div>
                    <!-- Back -->
                    <div class="card-face card-back">
                        <div>
                            <span class="card-tag" style="color: #93c5fd;">핵심 키워드 및 구성도</span>
                            <div class="card-title" id="back-title" style="font-size: 1.1rem;">토픽 제목</div>
                            <div class="keywords-container" id="back-keywords"></div>
                        </div>
                        <div class="card-body">
                            <div class="diagram-box" id="back-diagram"></div>
                        </div>
                        <div style="text-align: center; font-size: 0.75rem; color: #93c5fd;">탭하여 앞면으로 ↻</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevCard(event)">이전</button>
                <button class="ctrl-btn primary" onclick="nextCard(event)">다음 카드 →</button>
            </div>
        </div>
    </div>

    <script src="topics.js"></script>
    <script>
        let currentDeck = [];
        let currentIndex = 0;
        let isFlipped = false;

        function initApp() {
            if (typeof topics === 'undefined' || !topics.length) {
                document.getElementById('domain-grid').innerHTML = '<p style="color:red; grid-column:span 2;">topics.js 로드 대기 중...</p>';
                return;
            }
            
            document.getElementById('total-badge').innerText = `총 ${topics.length}개 토픽`;

            const domainCounts = {};
            topics.forEach(t => {
                domainCounts[t.domain] = (domainCounts[t.domain] || 0) + 1;
            });

            const grid = document.getElementById('domain-grid');
            grid.innerHTML = '';

            Object.keys(domainCounts).forEach(domain => {
                const btn = document.createElement('div');
                btn.className = 'domain-btn';
                btn.onclick = () => startStudy(domain);
                btn.innerHTML = `
                    <div class="domain-name">${domain}</div>
                    <div class="domain-count">${domainCounts[domain]}개 토픽</div>
                `;
                grid.appendChild(btn);
            });
        }

        function startStudy(domain) {
            if (domain === 'ALL') {
                currentDeck = [...topics].sort(() => Math.random() - 0.5);
            } else {
                currentDeck = topics.filter(t => t.domain === domain).sort(() => Math.random() - 0.5);
            }

            if (currentDeck.length === 0) {
                alert('해당 도메인에 토픽이 없습니다.');
                return;
            }

            currentIndex = 0;
            isFlipped = false;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('study-view').style.display = 'flex';
            renderCard();
        }

        function goHome() {
            document.getElementById('study-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('is-flipped');
            } else {
                card.classList.remove('is-flipped');
            }
        }

        function renderCard() {
            const card = currentDeck[currentIndex];
            document.getElementById('flashcard').classList.remove('is-flipped');
            isFlipped = false;

            document.getElementById('front-domain').innerText = card.domain;
            document.getElementById('front-title').innerText = card.topic;
            
            document.getElementById('back-title').innerText = card.topic;
            
            const kwContainer = document.getElementById('back-keywords');
            kwContainer.innerHTML = '';
            if (card.keywords && card.keywords.length) {
                card.keywords.forEach(kw => {
                    const span = document.createElement('span');
                    span.className = 'keyword-badge';
                    span.innerText = kw;
                    kwContainer.appendChild(span);
                });
            }

            const diagBox = document.getElementById('back-diagram');
            if (card.diagram) {
                diagBox.style.display = 'block';
                diagBox.innerText = card.diagram;
            } else {
                diagBox.style.display = 'none';
            }

            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentDeck.length}`;
        }

        function nextCard(event) {
            event.stopPropagation();
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                alert('마지막 카드입니다!');
            }
        }

        function prevCard(event) {
            event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            } else {
                alert('첫 번째 카드입니다!');
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
