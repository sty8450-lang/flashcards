<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기술사 암기장</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
        .container { max-width: 820px; width: 100%; height: 100%; margin: 0 auto; padding: 12px; flex: 1; display: flex; flex-direction: column; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        
        /* Home View */
        #home-view { display: flex; flex-direction: column; gap: 16px; flex: 1; }
        .hero-card { background: var(--accent-gradient); border-radius: 16px; padding: 20px; color: #fff; text-align: center; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2); transition: transform 0.1s; }
        .hero-card:active { transform: scale(0.98); }
        .hero-card h2 { font-size: 1.3rem; margin-bottom: 6px; }
        .hero-card p { font-size: 0.85rem; opacity: 0.9; }

        .section-title { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
        
        /* Domain Grid - Optimized for Fold 7 Cover & Inner screens */
        .domain-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 500px) { .domain-grid { grid-template-columns: repeat(3, 1fr); } }
        
        .domain-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 12px; text-align: left; cursor: pointer; color: var(--text-primary); transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 75px; }
        .domain-btn:active { background: var(--border-color); }
        .domain-name { font-weight: 600; font-size: 1rem; }
        .domain-count { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }

        /* Study View */
        #study-view { display: none; flex-direction: column; flex: 1; min-height: 0; gap: 12px; }
        .study-header { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .progress-text { font-size: 0.85rem; color: var(--text-secondary); }

        /* Flashcard */
        .card-container { perspective: 1000px; flex: 1; display: flex; flex-direction: column; min-height: 520px; cursor: pointer; position: relative; }
        .card { flex: 1; width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-back { transform: rotateY(180deg); background: #0f1d3a; border-color: #1e40af; }
        
        .card-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
        .front-domain-pill { display: inline-block; font-size: 1.05rem; font-weight: 800; color: var(--accent); background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); padding: 6px 18px; border-radius: 999px; letter-spacing: 0.06em; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin: 6px 0; line-height: 1.35; }
        .front-center-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; padding: 16px 6px; width: 100%; }
        .front-main-title { font-size: clamp(2.35rem, 7.2vw, 3.3rem); font-weight: 900; line-height: 1.28; color: #ffffff; word-break: keep-all; letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35); width: 100%; }
        .front-mnemonic-box { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; background: rgba(250, 204, 21, 0.18); border: 2px solid rgba(250, 204, 21, 0.65); border-radius: 16px; color: #fef08a; font-size: clamp(1.4rem, 4.6vw, 2rem); font-weight: 800; letter-spacing: 0.02em; line-height: 1.4; word-break: keep-all; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28); }
        .card-body { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.45; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; }
        .keywords-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
        .keyword-badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 16px; font-size: 0.72rem; font-weight: 500; }

        /* Back Section Labels */
        .back-section-label { font-size: 0.72rem; font-weight: 700; color: #93c5fd; letter-spacing: 0.03em; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .back-section-label::before { content: ""; display: inline-block; width: 3px; height: 11px; background: var(--accent); border-radius: 2px; }

        /* ⓪ Top Definition Callout Area */
        .definition-wrapper { display: none; flex-direction: column; }
        .definition-callout { background: linear-gradient(135deg, rgba(30, 58, 138, 0.55) 0%, rgba(15, 23, 42, 0.85) 100%); border: 1px solid rgba(56, 189, 248, 0.4); border-left: 4px solid var(--accent); padding: 10px 12px; border-radius: 8px; color: #f8fafc; font-size: 0.86rem; font-weight: 600; line-height: 1.45; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); word-break: keep-all; }

        /* ① Top Diagram Area */
        .diagram-wrapper { display: none; flex-direction: column; }
        .diagram-box { background: rgba(2, 6, 23, 0.55); border: 1px solid rgba(56, 189, 248, 0.25); padding: 10px 12px; border-radius: 8px; font-family: "Pretendard", "Malgun Gothic", monospace; font-size: 0.8rem; white-space: pre-wrap; line-height: 1.5; color: #e2e8f0; }
        .diagram-box.has-image { background: #ffffff; padding: 8px; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: center; white-space: normal; }
        .diagram-box img { width: 100%; max-width: 100%; max-height: 380px; height: auto; object-fit: contain; border-radius: 6px; display: block; }

        /* ② Bottom Sub-note Table Area */
        .subnote-table-wrapper { display: none; flex-direction: column; }
        .subnote-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; background: rgba(15, 23, 42, 0.65); border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        .subnote-table th { background: #1e3a8a; color: #e0f2fe; font-weight: 700; padding: 7px 8px; border: 1px solid #334155; text-align: center; font-size: 0.74rem; white-space: nowrap; }
        .subnote-table td { padding: 7px 8px; border: 1px solid #334155; color: #f1f5f9; vertical-align: middle; line-height: 1.4; word-break: keep-all; }
        .subnote-table td.col-major { width: 20%; font-weight: 700; color: #7dd3fc; background: rgba(30, 58, 138, 0.28); text-align: center; }
        .subnote-table td.col-minor { width: 24%; font-weight: 600; color: #bae6fd; background: rgba(30, 41, 59, 0.5); text-align: center; }
        .subnote-table td.col-desc { width: 56%; color: #e2e8f0; text-align: left; white-space: pre-line; }

        /* ③ 3단락 실전 차별화 콜아웃 및 ASCII 다이어그램 스타일 */
        .diff-callout { display: none; flex-direction: column; gap: 6px; background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(244, 63, 94, 0.1)); border: 1px solid rgba(251, 191, 36, 0.55); border-left: 4px solid #f59e0b; border-radius: 10px; padding: 11px 13px; margin-top: 8px; box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.08) inset; }
        .diff-title { font-size: 0.8rem; font-weight: 800; color: #fbbf24; letter-spacing: 0.02em; }
        .diff-text { font-size: 0.84rem; color: #fef3c7; line-height: 1.55; white-space: pre-line; word-break: keep-all; }
        .details-ascii { background: rgba(2, 6, 23, 0.65); border: 1px solid rgba(56, 189, 248, 0.25); padding: 9px 10px; border-radius: 8px; font-family: "D2Coding", "Consolas", "Malgun Gothic", monospace; font-size: 0.72rem; line-height: 1.35; white-space: pre; overflow-x: auto; color: #e2e8f0; margin: 0; }
        .details-note { font-size: 0.8rem; color: #cbd5e1; line-height: 1.45; white-space: pre-line; margin-top: 6px; }

        /* Controls */
        .controls { display: flex; gap: 8px; margin-top: 10px; padding-bottom: 10px; }
        .ctrl-btn { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 13px 8px; border-radius: 10px; font-weight: 700; font-size: 0.92rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .ctrl-btn:active { transform: scale(0.97); background: var(--border-color); }
        .ctrl-btn.check-btn { border-color: rgba(74, 222, 128, 0.45); color: #86efac; background: rgba(22, 101, 52, 0.25); }
        .ctrl-btn.check-btn.is-mastered { background: #22c55e; color: #052e16; border-color: #22c55e; font-weight: 800; }
        .ctrl-btn.primary { background: var(--accent); color: #0f172a; border: none; font-weight: 800; }
    </style>
</head>
<body>
    <div class="container">
        <header id="app-header">
            <h1>기술사 암기장</h1>
            <span id="total-badge" style="font-size: 0.8rem; color: var(--text-secondary);"></span>
        </header>

        <!-- Home View -->
        <div id="home-view">
            <div class="hero-card" onclick="startStudy('ALL')">
                <h2>전체 셔플 학습</h2>
                <p>모든 도메인 카드를 무작위로 섞어서 풀기</p>
            </div>

            <div>
                <div class="section-title">도메인 선택</div>
                <div class="domain-grid" id="domain-grid">
                    <!-- Dynamic Loading -->
                </div>
            </div>
        </div>

        <!-- Study View -->
        <div id="study-view">
            <div class="study-header">
                <button class="back-btn" onclick="goHome()">← 홈으로</button>
                <div class="progress-text" id="progress-text">1 / 10</div>
            </div>

            <div class="card-container" onclick="flipCard()">
                <div class="card" id="flashcard">
                    <!-- Front -->
                    <div class="card-face card-front">
                        <div style="text-align: center; padding-top: 4px;">
                            <span class="front-domain-pill" id="front-domain">도메인</span>
                        </div>
                        <div class="front-center-area">
                            <div class="front-main-title" id="front-title">토픽 제목</div>
                            <div class="front-mnemonic-box" id="front-mnemonic">💡 두음: -</div>
                        </div>
                        <div style="text-align: center; font-size: 0.9rem; color: var(--text-secondary);">카드를 터치하여 뒷면 확인 ↻</div>
                    </div>
                    <!-- Back -->
                    <div class="card-face card-back">
                        <div class="card-body" id="back-scroll-body">
                            <div>
                                <span class="card-tag" id="back-domain" style="color: #93c5fd;">핵심 구성도 및 서브노트</span>
                                <div class="card-title" id="back-title" style="font-size: 1.08rem; color: #f8fafc;">토픽 제목</div>
                                <div class="keywords-container" id="back-keywords"></div>
                            </div>

                            <!-- ⓪ 최상단: 1단락 핵심 정의 콜아웃 영역 -->
                            <div class="definition-wrapper" id="definition-wrapper">
                                <div class="back-section-label">1단락 핵심 정의 (25~30자)</div>
                                <div class="definition-callout" id="back-definition"></div>
                            </div>

                            <!-- ① 상단: 다이어그램(diagram) 영역 -->
                            <div class="diagram-wrapper" id="diagram-wrapper">
                                <div class="back-section-label">구성도 / 핵심 개념도</div>
                                <div class="diagram-box" id="back-diagram"></div>
                            </div>

                            <!-- ② 하단: 기술사 서브노트 스타일 표(Table) 영역 -->
                            <div class="subnote-table-wrapper" id="table-wrapper">
                                <div class="back-section-label">핵심 서브노트 요약표</div>
                                <table class="subnote-table">
                                    <thead>
                                        <tr>
                                            <th>대분류</th>
                                            <th>소분류</th>
                                            <th>핵심 기술 및 특징</th>
                                        </tr>
                                    </thead>
                                    <tbody id="back-table-body"></tbody>
                                </table>
                            
                            <!-- ③ 최하단: 3단락 실전 차별화 영역 -->
                            <div class="diff-callout" id="diff-wrapper">
                                <div class="diff-title">🎯 [3단락] 기술사적 차별화 포인트</div>
                                <div class="diff-text" id="back-diff"></div>
                            </div>
                        </div>

                        <div style="text-align: center; font-size: 0.75rem; color: #93c5fd; padding-top: 6px;">탭하여 앞면으로 ↻</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevCard(event)">← 이전</button>
                <button class="ctrl-btn check-btn" id="master-btn" onclick="toggleMastered(event)">☐ 이해함</button>
                <button class="ctrl-btn primary" onclick="nextCard(event)">다음 카드 →</button>
            </div>
        </div>
    </div>

    <script src="topics.js"></script>
    <script>
        let currentDeck = [];
        let currentIndex = 0;
        let isFlipped = false;
        let masteredSet = new Set();
        const MASTERED_STORAGE_KEY = 'itpe_mastered_topics_v1';

        function loadMastered() {
            try {
                const raw = localStorage.getItem(MASTERED_STORAGE_KEY);
                if (raw) {
                    masteredSet = new Set(JSON.parse(raw));
                }
            } catch (e) {
                masteredSet = new Set();
            }
        }

        function saveMastered() {
            try {
                localStorage.setItem(MASTERED_STORAGE_KEY, JSON.stringify([...masteredSet]));
            } catch (e) {}
        }

        function getTopicKey(card) {
            return `${card.domain}::${card.topic}`;
        }

        function isMastered(card) {
            return masteredSet.has(getTopicKey(card));
        }

        function initApp() {
            loadMastered();
            if (typeof topics === 'undefined' || !topics.length) {
                document.getElementById('domain-grid').innerHTML = '<p style="color:red; grid-column:span 2;">topics.js 로드 대기 중...</p>';
                return;
            }
            
            document.getElementById('total-badge').innerText = `총 ${topics.length}개 토픽`;

            const domainCounts = {};
            const domainMasteredCounts = {};
            topics.forEach(t => {
                domainCounts[t.domain] = (domainCounts[t.domain] || 0) + 1;
                if (isMastered(t)) {
                    domainMasteredCounts[t.domain] = (domainMasteredCounts[t.domain] || 0) + 1;
                }
            });

            const grid = document.getElementById('domain-grid');
            grid.innerHTML = '';

            Object.keys(domainCounts).forEach(domain => {
                const total = domainCounts[domain];
                const done = domainMasteredCounts[domain] || 0;
                const btn = document.createElement('div');
                btn.className = 'domain-btn';
                btn.onclick = () => startStudy(domain);
                btn.innerHTML = `
                    <div class="domain-name">${domain}</div>
                    <div class="domain-count">${total}개 토픽 ${done > 0 ? `<span style="color:#4ade80;">(이해 ${done})</span>` : ''}</div>
                `;
                grid.appendChild(btn);
            });
        }

        function startStudy(domain) {
            const pool = domain === 'ALL' ? [...topics] : topics.filter(t => t.domain === domain);

            if (pool.length === 0) {
                alert('해당 도메인에 토픽이 없습니다.');
                return;
            }

            // 미암기 카드는 앞쪽에 랜덤 배치, 이해한 카드는 맨 뒤쪽에 배치
            const unmastered = pool.filter(t => !isMastered(t)).sort(() => Math.random() - 0.5);
            const mastered = pool.filter(t => isMastered(t)).sort(() => Math.random() - 0.5);
            currentDeck = [...unmastered, ...mastered];

            currentIndex = 0;
            isFlipped = false;
            document.getElementById('app-header').style.display = 'none';
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('study-view').style.display = 'flex';
            renderCard();
        }

        function goHome() {
            document.getElementById('study-view').style.display = 'none';
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('home-view').style.display = 'flex';
            initApp();
        }

        let justSwiped = false;
        function flipCard() {
            if (justSwiped) {
                justSwiped = false;
                return;
            }
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('is-flipped');
            } else {
                card.classList.remove('is-flipped');
            }
        }

        
        function parseMdTableRows(mdText) {
            if (!mdText) return null;
            const lines = mdText.split('\n').map(l => l.trim()).filter(l => l.startsWith('|'));
            if (lines.length < 3) return null;
            const parseCells = l => {
                let t = l;
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            };
            const header = parseCells(lines[0]);
            const body = lines.slice(2).map(parseCells);
            return body.map(row => {
                if (row.length >= 3) {
                    return { major: row[0], minor: row[1], desc: row.slice(2).join(' | ') };
                } else if (row.length === 2) {
                    return { major: row[0], minor: '', desc: row[1] };
                }
                return { major: row[0] || '', minor: '', desc: '' };
            });
        }

        function renderSubnoteTable(rows) {
            const tableWrapper = document.getElementById('table-wrapper');
            const tbody = document.getElementById('back-table-body');
            tbody.innerHTML = '';

            if (!Array.isArray(rows) || rows.length === 0) {
                tableWrapper.style.display = 'none';
                return;
            }

            tableWrapper.style.display = 'flex';

            // Normalize row objects: support { category, sub, desc } / { major, minor, desc } or [major, minor, desc]
            const normalized = rows.map(r => {
                if (Array.isArray(r)) {
                    return { major: r[0] || '', minor: r[1] || '', desc: r[2] || '' };
                }
                return {
                    major: r.major ?? r.category ?? r.대분류 ?? '',
                    minor: r.minor ?? r.sub ?? r.subCategory ?? r.소분류 ?? '',
                    desc: r.desc ?? r.feature ?? r.특징 ?? ''
                };
            });

            // Calculate rowspan for consecutive identical major categories OR empty string "" continuation
            const rowspans = new Array(normalized.length).fill(1);
            for (let i = 0; i < normalized.length; i++) {
                if (rowspans[i] === 0) continue;
                let span = 1;
                while (
                    i + span < normalized.length &&
                    normalized[i].major !== '' &&
                    (normalized[i + span].major === '' || normalized[i + span].major === normalized[i].major)
                ) {
                    rowspans[i + span] = 0;
                    span++;
                }
                rowspans[i] = span;
            }

            normalized.forEach((row, idx) => {
                const tr = document.createElement('tr');

                if (rowspans[idx] > 0) {
                    const tdMajor = document.createElement('td');
                    tdMajor.className = 'col-major';
                    if (rowspans[idx] > 1) {
                        tdMajor.rowSpan = rowspans[idx];
                    }
                    tdMajor.innerText = row.major;
                    tr.appendChild(tdMajor);
                }

                const tdMinor = document.createElement('td');
                tdMinor.className = 'col-minor';
                tdMinor.innerText = row.minor;
                tr.appendChild(tdMinor);

                const tdDesc = document.createElement('td');
                tdDesc.className = 'col-desc';
                tdDesc.innerText = row.desc;
                tr.appendChild(tdDesc);

                tbody.appendChild(tr);
            });
        }

        function renderCard() {
            const card = currentDeck[currentIndex];
            document.getElementById('flashcard').classList.remove('is-flipped');
            isFlipped = false;

            document.getElementById('front-domain').innerText = card.domain;
            document.getElementById('front-title').innerText = card.topic;

            const mnemonicEl = document.getElementById('front-mnemonic');
            if (card.mnemonic && card.mnemonic.trim() !== '') {
                mnemonicEl.style.display = 'flex';
                mnemonicEl.innerText = `💡 두음: ${card.mnemonic}`;
            } else {
                mnemonicEl.style.display = 'none';
            }
            
            document.getElementById('back-domain').innerText = `${card.domain} · 서브노트`;
            document.getElementById('back-title').innerText = card.topic;
            
            const kwContainer = document.getElementById('back-keywords');
            kwContainer.innerHTML = '';
            if (card.keywords && card.keywords.length) {
                kwContainer.style.display = 'flex';
                card.keywords.forEach(kw => {
                    const span = document.createElement('span');
                    span.className = 'keyword-badge';
                    span.innerText = kw;
                    kwContainer.appendChild(span);
                });
            } else {
                kwContainer.style.display = 'none';
            }

            // ⓪ 최상단 1단락 핵심 정의 콜아웃 렌더링
            const defWrapper = document.getElementById('definition-wrapper');
            const defBox = document.getElementById('back-definition');
            if (card.definition && card.definition.trim() !== '') {
                defWrapper.style.display = 'flex';
                defBox.innerText = card.definition;
            } else {
                defWrapper.style.display = 'none';
                defBox.innerText = '';
            }

            // ① 상단 다이어그램 영역 (이미지, ASCII 아키텍처 또는 텍스트 렌더링)
            const diagWrapper = document.getElementById('diagram-wrapper');
            const diagBox = document.getElementById('back-diagram');
            diagBox.classList.remove('has-image');
            diagBox.innerHTML = '';

            const imgSrc = card.diagramImg || (typeof card.diagram === 'string' && /\.(png|jpe?g|gif|webp|svg)$/i.test(card.diagram.trim()) ? card.diagram.trim() : null);

            let asciiPart = '';
            let mdTableRows = null;

            if (card.details && typeof card.details === 'string') {
                const lines = card.details.replace(/\r\n/g, '\n').split('\n');
                const sepIdx = lines.findIndex(l => /^\s*\|\s*:?-{2,}/.test(l));
                if (sepIdx > 0) {
                    asciiPart = lines.slice(0, sepIdx - 1).join('\n').trim();
                    const tableText = lines.slice(sepIdx - 1).join('\n');
                    mdTableRows = parseMdTableRows(tableText);
                } else {
                    asciiPart = card.details.trim();
                }
            }

            if (imgSrc) {
                diagWrapper.style.display = 'flex';
                diagBox.classList.add('has-image');
                let imgHtml = `<img src="${imgSrc}" alt="${card.topic} 구성도">`;
                if (asciiPart) {
                    imgHtml += `<pre class="details-ascii" style="width:100%; margin-top:8px;">${asciiPart}</pre>`;
                }
                diagBox.innerHTML = imgHtml;
            } else if (typeof card.diagram === 'string' && card.diagram.trim().startsWith('<img')) {
                diagWrapper.style.display = 'flex';
                diagBox.classList.add('has-image');
                diagBox.innerHTML = card.diagram;
            } else if (asciiPart) {
                diagWrapper.style.display = 'flex';
                diagBox.innerHTML = `<pre class="details-ascii">${asciiPart}</pre>`;
            } else if (card.diagram && card.diagram.trim() !== '') {
                diagWrapper.style.display = 'flex';
                diagBox.innerText = card.diagram;
            } else {
                diagWrapper.style.display = 'none';
            }

            // ② 하단 서브노트 표 영역 (tableRows 또는 details 마크다운 표 동적 렌더링)
            const finalTableRows = card.tableRows || mdTableRows;
            renderSubnoteTable(finalTableRows);

            // ③ 최하단: 3단락 실전 차별화 콜아웃 렌더링
            const diffWrapper = document.getElementById('diff-wrapper');
            const diffBox = document.getElementById('back-diff');
            if (card.differentiation && card.differentiation.trim() !== '') {
                diffWrapper.style.display = 'flex';
                diffBox.innerText = card.differentiation;
            } else {
                diffWrapper.style.display = 'none';
                diffBox.innerText = '';
            }

            const backScroll = document.getElementById('back-scroll-body');
            if (backScroll) backScroll.scrollTop = 0;

            const masterBtn = document.getElementById('master-btn');
            const mastered = isMastered(card);
            if (masterBtn) {
                if (mastered) {
                    masterBtn.classList.add('is-mastered');
                    masterBtn.innerText = '✅ 이해완료';
                } else {
                    masterBtn.classList.remove('is-mastered');
                    masterBtn.innerText = '☐ 이해함';
                }
            }

            document.getElementById('front-domain').innerText = mastered ? `${card.domain} · ✅ 이해완료` : card.domain;
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentDeck.length}`;
        }

        function toggleMastered(event) {
            if (event) event.stopPropagation();
            if (!currentDeck.length) return;

            const card = currentDeck[currentIndex];
            const key = getTopicKey(card);

            if (masteredSet.has(key)) {
                // 이미 이해함 상태인 경우 -> 체크 해제
                masteredSet.delete(key);
                saveMastered();
                renderCard();
            } else {
                // 새로 이해함 체크 -> 저장 후 현재 덱의 맨 뒤로 이동!
                masteredSet.add(key);
                saveMastered();

                if (currentDeck.length > 1) {
                    const [movedCard] = currentDeck.splice(currentIndex, 1);
                    currentDeck.push(movedCard);
                    if (currentIndex >= currentDeck.length) {
                        currentIndex = 0;
                    }
                }
                renderCard();
            }
        }

        function nextCard(event) {
            if (event) event.stopPropagation();
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                alert('마지막 카드입니다!');
            }
        }

        function prevCard(event) {
            if (event) event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            } else {
                alert('첫 번째 카드입니다!');
            }
        }

        // 엄지손가락 좌우 스와이프 제스처 지원
        function setupSwipeGesture() {
            const container = document.querySelector('.card-container');
            if (!container) return;

            let startX = 0;
            let startY = 0;

            container.addEventListener('touchstart', (e) => {
                if (!e.touches || e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                justSwiped = false;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (!e.changedTouches || e.changedTouches.length !== 1) return;
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const dx = endX - startX;
                const dy = endY - startY;

                // 가로 스와이프 거리가 50px 이상이고 세로 스크롤보다 가로 이동이 뚜렷할 때
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                    justSwiped = true;
                    if (dx < 0) {
                        // 오른쪽 -> 왼쪽으로 밀기: 다음 카드
                        nextCard();
                    } else {
                        // 왼쪽 -> 오른쪽으로 밀기: 이전 카드
                        prevCard();
                    }
                }
            }, { passive: true });
        }

        window.onload = () => {
            initApp();
            setupSwipeGesture();
        };
    </script>
</body>
</html>
